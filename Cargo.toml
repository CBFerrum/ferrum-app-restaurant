[package]
name = "ferrum-app-restaurant"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "A restaurant: tables and menus, orders for dine-in, takeaway and delivery, kitchen tickets by station, bills through ERP and reservations"
repository = "https://github.com/CBFerrum/ferrum-app-restaurant"
build = "build.rs"

[dependencies]
ferrum-kernel = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
ferrum-meta = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
ferrum-domain = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.43", features = ["serde-with-str", "maths"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "rust_decimal", "json", "migrate", "macros"] }
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }

[dev-dependencies]
# Its tests run on ERP's records (customers, items, invoices), and check that its interface is a
# release the platform takes.
ferrum-app-erp = { git = "https://github.com/CBFerrum/ferrum-app-erp", branch = "main" }
# A bill put on a hotel room goes through Hospitality's room charges, installed beside it.
ferrum-app-hospitality = { git = "https://github.com/CBFerrum/ferrum-app-hospitality", branch = "main" }
ferrum-apps = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }

[lints.clippy]
# Deliberate patterns shared with the platform: sqlx row tuples.
type_complexity = "allow"

[profile.dev]
debug = "line-tables-only"
