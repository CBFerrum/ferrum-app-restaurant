package: restaurant
version: 0.1.0
label: Restaurant
description: "A restaurant: tables and menus, orders for dine-in, takeaway and delivery, kitchen tickets by station, bills through ERP and reservations"
depends: [core, selling, accounting, inventory, manufacturing]

modules:
  - name: restaurant
    label: Restaurant
    icon: utensils
    order: 46
    items: [RestaurantOrder, KitchenTicket, TableReservation, DiningTable, Menu, Outlet]

# Reservations and delivery orders hold a guest's name, phone and address: a retention rule clears
# them (they are matched by phone, which personal-data requests do not search).
roles:
  - name: Restaurant Manager
    description: Runs the outlets, tables and menus, and sees every order, ticket and reservation.
    permissions:
      - {entity: Outlet, read: true, write: true, create: true}
      - {entity: DiningTable, read: true, write: true, create: true, delete: true}
      - {entity: Menu, read: true, write: true, create: true, delete: true}
      - {entity: RestaurantOrder, read: true, write: true, create: true, export: true}
      - {entity: KitchenTicket, read: true, write: true}
      - {entity: TableReservation, read: true, write: true, create: true, delete: true}
      - {entity: Customer, read: true, write: true, create: true}
      - {entity: Item, read: true}
      - {entity: Company, read: true}
      - {entity: SalesInvoice, read: true, create: true}
      - {entity: PaymentEntry, read: true, create: true}
      - {entity: Warehouse, read: true}
      - {entity: Account, read: true}
      - {entity: StockEntry, read: true}
  - name: Server
    description: Takes orders and reservations, sends them to the kitchen and bills them.
    permissions:
      - {entity: Outlet, read: true}
      - {entity: DiningTable, read: true}
      - {entity: Menu, read: true}
      - {entity: RestaurantOrder, read: true, write: true, create: true}
      - {entity: KitchenTicket, read: true}
      - {entity: TableReservation, read: true, write: true, create: true}
      - {entity: Customer, read: true}
      - {entity: Item, read: true}
      - {entity: SalesInvoice, read: true, create: true}
      - {entity: PaymentEntry, read: true, create: true}
  - name: Kitchen
    description: Works the tickets for their station, from preparing to served.
    permissions:
      - {entity: KitchenTicket, read: true, write: true}
      - {entity: RestaurantOrder, read: true}
      - {entity: Menu, read: true}

personal_data:
  - {entity: TableReservation, match: phone, phone: phone, name: guest_name, erase: [guest_name, phone]}
  - {entity: RestaurantOrder, match: phone, phone: phone, name: customer_name, erase: [customer_name, phone, delivery_address]}
