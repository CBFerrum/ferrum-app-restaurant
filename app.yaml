id: restaurant
name: Restaurant
version: 0.3.0
publisher: cbferrum
summary: "Tables and menus, orders with choices for dine-in, takeaway and delivery, kitchen tickets by station, bills by seat paid at the table, stock by recipe and reservations"
description: README.md
categories: [sales, industry]
license: AGPL-3.0-only
homepage: https://github.com/CBFerrum/ferrum-app-restaurant
support: https://github.com/CBFerrum/ferrum-app-restaurant/issues
runtime: native
platform: ">=0.3.2, <0.4"
# Records of ERP (customers, items, invoices): installing it installs ERP.
requires: {erp: ">=0.1"}
packages: [restaurant]
uninstall: ask
# Its own interface at /restaurant/: the floor and the kitchen, and the records.
ui:
  dist: ui/dist
contributes:
  shell.app:
    - id: restaurant
      route: restaurant
      title: Restaurant
      description: The floor, the kitchen, orders and reservations
      icon: utensils
      color: "#b45309"
      roles: [Restaurant Manager, Server, Kitchen]
  shell.open:
    - {id: restaurant, package: restaurant, path: "restaurant/e/{entity}/{id}", list: "restaurant/e/{entity}"}
  shell.create:
    - {id: order, label: Order, path: restaurant/e/RestaurantOrder/new, entity: RestaurantOrder}
  # What the assistant should know in Restaurant's pages, and what it suggests asking there.
  shell.assistant:
    - id: restaurant
      title: "Restaurant"
      instructions: >-
        A RestaurantOrder (Open, Billed, Cancelled) is for a table, a takeaway or a delivery. Its lines go to the
        kitchen as KitchenTicket by station (Queued, Preparing, Ready, Served, Voided), and its bill is an ERP
        invoice. A TableReservation is Booked, Seated, Cancelled or No Show.
      suggestions:
        - "Which tables are taken now?"
        - "What sold best this week?"
        - "How many reservations do we have tonight?"
